# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - baseUrl
      - token
    properties:
      baseUrl:
        type: string
        description: The base URL of your paperless-ngx instance.
      token:
        type: string
        description: The API token for accessing your paperless-ngx instance.
      toolsets:
        type: string
        description: >-
          Comma-separated toolsets to expose, or "full" for everything.
          Defaults to core,taxonomy,search,bulk.
      mode:
        type: string
        enum: [readonly, write, admin]
        description: readonly refuses to register any mutating tool. Defaults to write.
  commandFunction:
    |-
    (config) => ({
      command: 'node',
      args: ['dist/index.js', config.baseUrl, config.token],
      env: {
        ...(config.toolsets ? { PAPERLESS_TOOLSETS: config.toolsets } : {}),
        ...(config.mode ? { PAPERLESS_MODE: config.mode } : {})
      }
    })
